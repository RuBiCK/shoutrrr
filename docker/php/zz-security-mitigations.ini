; Mitigation for CVE-2026-109619 (stale request state reused by a later request on
; the same worker; https://www.php.net/archive/2026.php#2026-10-21-5). The real fix
; is PHP 8.5.12 — keep these until the serversideup base image ships it. The app
; uses neither feature, so they are safe to keep afterwards.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
